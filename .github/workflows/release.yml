name: Release

# Push a tag equal to the version in manifest.json (no "v" prefix, as Obsidian expects):
#   git tag 0.1.1 && git push origin 0.1.1
on:
  push:
    tags:
      - "[0-9]+.[0-9]+.[0-9]+*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Manifest version must equal the tag
        run: |
          v=$(node -p "require('./manifest.json').version")
          [ "$v" = "${GITHUB_REF_NAME}" ] || { echo "manifest.json says $v but the tag is ${GITHUB_REF_NAME}"; exit 1; }
          node -e "const v=require('./versions.json'); if(!v[process.env.GITHUB_REF_NAME]){console.error('versions.json has no entry for '+process.env.GITHUB_REF_NAME);process.exit(1)}"
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Publish release with main.js, manifest.json and styles.css
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" main.js manifest.json styles.css \
            --title "${GITHUB_REF_NAME}" --generate-notes
